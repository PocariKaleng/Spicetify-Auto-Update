name: Check Windows scripts
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell behavior
        shell: powershell
        run: ./tests/check.ps1
      - name: Check theme JavaScript
        run: node --check ./themes/ElainaGlass/theme.js
